<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>AI 구독 위젯 로그인</title>
<style>
  :root { color-scheme: light dark; --bg: #faf9f5; --ink: #25372e; --muted: #5d655b; --accent: #2c5541; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161a17; --ink: #e8ece6; --muted: #a9b2a6; --accent: #7fb595; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 72px 22px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 24px; word-break: keep-all; }
  a.btn { display: block; text-align: center; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>AI 구독 위젯</h1>
  <p id="msg">로그인 결과를 확인하고 있습니다.</p>
  <a id="go" class="btn" hidden>Scriptable로 돌아가기</a>
</main>
<script>
// Hands the one-time OAuth result back to the Scriptable script. Nothing is stored or sent anywhere else.
// The code is useless without the PKCE verifier that exists only on the iPhone.
(function () {
  var query = new URLSearchParams(location.search);
  var out = new URLSearchParams();
  out.set('scriptName', 'AI 구독 위젯');
  var found = false;
  ['code', 'state', 'error', 'error_description'].forEach(function (key) {
    var value = query.get(key);
    if (value) { out.set(key, value); found = true; }
  });
  // Remove the code from the address bar and history right away.
  history.replaceState(null, '', location.pathname);
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');
  if (!found) { msg.textContent = '이 페이지는 AI 구독 위젯에서 로그인한 뒤에만 사용합니다.'; return; }
  var target = 'scriptable:///run?' + out.toString().replace(/\+/g, '%20');
  go.href = target;
  go.hidden = false;
  msg.textContent = query.get('error') ? '로그인이 완료되지 않았습니다. 버튼을 눌러 Scriptable로 돌아가 주세요.' : '로그인되었습니다. 자동으로 넘어가지 않으면 버튼을 눌러 주세요.';
  location.replace(target);
})();
</script>
</body>
</html>
